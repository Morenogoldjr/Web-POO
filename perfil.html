<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Shojostyle</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="header-inner">
        <h1>Shojostyle</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="Productos.html">Productos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="perfil.html">Mi Perfil</a></li>
                <li><a href="#" id="logout-btn" onclick="cerrarSesion(event)">Cerrar Sesión</a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="auth-page">
    <section class="auth-card">
        <h2>Mi Perfil</h2>
        
        <div id="profile-info">
            <form id="profile-form">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required>

                <label for="password">Nueva contraseña (opcional):</label>
                <input type="password" id="password" name="password" placeholder="Dejar en blanco para no cambiar">

                <button type="submit">Guardar cambios</button>
            </form>
        </div>

        <div id="message" class="message"></div>
    </section>
</main>

<script>
    function cerrarSesion(event) {
        event.preventDefault();
        localStorage.removeItem('usuarioId');
        localStorage.removeItem('usuarioCorreo');
        alert('Sesión cerrada');
        window.location.href = 'index.html';
    }
</script>

<script src="js/perfil.js"></script>
<script src="//code.tidio.co/8l8ktagmo5jjmc333cb276gjhl0ebttv.js" async></script>
</body>
</html>
