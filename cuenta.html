<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi cuenta - Shojostyle</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="header-inner">
        <h1>Shojostyle</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="Productos.html">Productos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="cuenta.html">Mi cuenta</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Registrarse</a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="auth-page">
    <section class="auth-card">
        <h2>Administrador de cuenta</h2>
        <p class="message" id="accountMessage"></p>

        <form id="accountForm">
            <label for="nombre">Nombre completo</label>
            <input id="nombre" name="nombre" type="text" placeholder="Tu nombre completo" required>

            <label for="correo">Correo electrónico</label>
            <input id="correo" name="correo" type="email" placeholder="correo@dominio.com" required>

            <label for="newPassword">Nueva contraseña</label>
            <input id="newPassword" name="newPassword" type="password" placeholder="Deja en blanco para mantener la misma">

            <button type="submit">Actualizar cuenta</button>
        </form>

        <button id="logoutBtn" type="button" class="secondary-button">Cerrar sesión</button>
    </section>
</main>

<script src="js/account.js"></script>
<script src="//code.tidio.co/8l8ktagmo5jjmc333cb276gjhl0ebttv.js" async></script>
</body>
</html>
