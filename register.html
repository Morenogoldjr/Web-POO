<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Shojostyle</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="header-inner">
        <h1>Shojostyle</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="Productos.html">Productos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Registrarse</a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="auth-page">
    <section class="auth-card">
        <h2>Crear una cuenta</h2>
        <form>
            <label>Nombre completo</label>
            <input type="text" placeholder="Ej. Ana Pérez" required>

            <label>Correo electrónico</label>
            <input type="email" placeholder="correo@dominio.com" required>

            <label>Contraseña</label>
            <input type="password" placeholder="Mínimo 8 caracteres" required>

            <label>Confirmar contraseña</label>
            <input type="password" placeholder="Repite tu contraseña" required>

            <button type="submit">Registrarse</button>
        </form>
        <p class="link-action">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </section>
</main>

</body>
</html>
