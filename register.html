<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Shojostyle</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="header-inner">
        <h1>Shojostyle</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="Productos.html">Productos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li id="nav-perfil" style="display: none;"><a href="perfil.html">Mi Perfil</a></li>
                <li id="nav-login"><a href="login.html">Login</a></li>
                <li id="nav-logout" style="display: none;"><a href="#" onclick="cerrarSesion(event)">Cerrar Sesión</a></li>
                <li id="nav-register"><a href="register.html">Registrarse</a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="auth-page">
    <section class="auth-card">
        <h2>Crear una cuenta</h2>
        <form id="register-form">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana Pérez" required>

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="correo@dominio.com" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>

            <label for="confirm-password">Confirmar contraseña</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Repite tu contraseña" required>

            <button type="submit">Registrarse</button>
        </form>
        <p class="link-action">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        <div id="message" class="message"></div>
    </section>
</main>

<script>
    function cerrarSesion(event) {
        event.preventDefault();
        localStorage.removeItem('usuarioId');
        localStorage.removeItem('usuarioCorreo');
        alert('Sesión cerrada');
        window.location.href = 'index.html';
    }

    function actualizarNavegacion() {
        const usuarioId = localStorage.getItem('usuarioId');
        if (usuarioId) {
            document.getElementById('nav-login').style.display = 'none';
            document.getElementById('nav-register').style.display = 'none';
            document.getElementById('nav-perfil').style.display = 'block';
            document.getElementById('nav-logout').style.display = 'block';
        }
    }

    actualizarNavegacion();
</script>

<script src="js/register.js"></script>
<script src="//code.tidio.co/8l8ktagmo5jjmc333cb276gjhl0ebttv.js" async></script>
</body>
</html>
