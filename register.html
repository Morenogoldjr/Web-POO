<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Shojostyle</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="header-inner">
        <h1>Shojostyle</h1>
        <nav>
            <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="Productos.html">Productos</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                    <li><a href="cuenta.html">Mi cuenta</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a href="register.html">Registrarse</a></li>
                </ul>
        </nav>
    </div>
</header>

<main class="auth-page">
    <section class="auth-card">
        <h2>Crear una cuenta</h2>
        <form id="registerForm">
            <p class="message" id="authMessage"></p>

            <label for="nombre">Nombre completo</label>
            <input id="nombre" name="nombre" type="text" placeholder="Ej. Ana Pérez" required>

            <label for="correo">Correo electrónico</label>
            <input id="correo" name="correo" type="email" placeholder="correo@dominio.com" required>

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" placeholder="Mínimo 8 caracteres" required>

            <label for="confirmPassword">Confirmar contraseña</label>
            <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Repite tu contraseña" required>

            <button type="submit">Registrarse</button>
        </form>
        </form>
        <script src="js/auth.js"></script>
        <p class="link-action">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </section>
</main>

<script src="//code.tidio.co/8l8ktagmo5jjmc333cb276gjhl0ebttv.js" async></script>
</body>
</html>
