<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shojostyle</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Shojostyle</h1>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="Productos.html">Productos</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li id="nav-perfil" style="display: none;"><a href="perfil.html">Mi Perfil</a></li>
            <li id="nav-login"><a href="login.html">Login</a></li>
            <li id="nav-logout" style="display: none;"><a href="#" onclick="cerrarSesion(event)">Cerrar Sesión</a></li>
            <li id="nav-register"><a href="register.html">Registrarse</a></li>
        </ul>
    </nav>
</header>

<section class="hero">
    <h2>Bienvenido a Shojostyle</h2>
    <p>Ofrecemos productos de calidad y servicio excepcional.</p>
    <img src="img/Principal.jpeg" alt="Imagen principal de Shojostyle" class="hero-image">
    </section>

    <script>
        // Verificar si el usuario está logueado y actualizar navegación
        function actualizarNavegacion() {
            const usuarioId = localStorage.getItem('usuarioId');
            if (usuarioId) {
                document.getElementById('nav-login').style.display = 'none';
                document.getElementById('nav-register').style.display = 'none';
                document.getElementById('nav-perfil').style.display = 'block';
                document.getElementById('nav-logout').style.display = 'block';
            }
        }

        function cerrarSesion(event) {
            event.preventDefault();
            localStorage.removeItem('usuarioId');
            localStorage.removeItem('usuarioCorreo');
            alert('Sesión cerrada');
            window.location.href = 'index.html';
        }

        actualizarNavegacion();
    </script>

    <script src="//code.tidio.co/8l8ktagmo5jjmc333cb276gjhl0ebttv.js" async></script>
</body>
</html>
